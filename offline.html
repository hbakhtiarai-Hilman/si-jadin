<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B4332">
  <title>SI-JADIN — Offline</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: radial-gradient(120% 80% at 50% 0%, #2D6A4F 0%, #1B4332 60%); color: #E8F3EE; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; max-width: 360px; color: #A7D7C5; }
    button { min-height: 44px; padding: 10px 20px; border: 0; border-radius: 10px; background: #D4A017; color: #2A1E00; font: 600 15px system-ui, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <img src="icons/icon-192.png" alt="">
  <h1>Anda sedang offline</h1>
  <p>SI-JADIN membutuhkan koneksi internet untuk mengambil data terbaru. Sambungkan kembali lalu coba lagi.</p>
  <button type="button" onclick="location.href='./'">Coba lagi</button>
</body>
</html>
